name: Build Mjölnir Desktop

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Run unit tests
        run: flutter test

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Package Windows Binary
        shell: pwsh
        run: |
          $sourceDir = "build\windows\x64\runner\Release"
          $zipFile = "Mjolnir-Windows-x64.zip"
          Compress-Archive -Path "$sourceDir\*" -DestinationPath $zipFile
          Write-Host "Created $zipFile successfully."

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mjolnir-Windows-x64
          path: Mjolnir-Windows-x64.zip
          retention-days: 14

  build-macos:
    name: Build macOS (Universal / arm64)
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable macOS Desktop
        run: flutter config --enable-macos-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Run unit tests
        run: flutter test

      - name: Build macOS Release
        run: flutter build macos --release

      - name: Package macOS App
        run: |
          cd build/macos/Build/Products/Release
          zip -r -y ../../../../../Mjolnir-macOS.zip Mjolnir.app

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mjolnir-macOS
          path: Mjolnir-macOS.zip
          retention-days: 14
