name: Build Mjölnir

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Run unit tests
        run: flutter test

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v6
        with:
          name: Mjolnir-Windows-x64
          path: build/windows/x64/runner/Release/
          retention-days: 14

  build-macos:
    name: Build macOS (Universal / arm64)
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable macOS Desktop
        run: flutter config --enable-macos-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Run unit tests
        run: flutter test

      - name: Build macOS Release
        run: flutter build macos --release

      - name: Package macOS App
        run: |
          cd build/macos/Build/Products/Release
          zip -r -y ../../../../../Mjolnir-macOS.zip Mjolnir.app

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v6
        with:
          name: Mjolnir-macOS
          path: Mjolnir-macOS.zip
          retention-days: 14

  build-android:
    name: Build Android (APK)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run unit tests
        run: flutter test

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v6
        with:
          name: Mjolnir-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  build-linux:
    name: Build Linux (x64)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Linux Desktop Build Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Linux Desktop
        run: flutter config --enable-linux-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Run unit tests
        run: flutter test

      - name: Build Linux Release
        run: flutter build linux --release

      - name: Package Linux Bundle
        run: |
          tar -czf Mjolnir-Linux-x64.tar.gz -C build/linux/x64/release bundle

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v6
        with:
          name: Mjolnir-Linux-x64
          path: Mjolnir-Linux-x64.tar.gz
          retention-days: 14


